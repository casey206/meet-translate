<!DOCTYPE html>
<html>
<head><title>產生 Icon</title></head>
<body>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;

  // 背景漸層
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#6366f1');
  grad.addColorStop(1, '#8b5cf6');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();

  // 地球圖示
  ctx.fillStyle = 'white';
  ctx.font = `bold ${s * 0.6}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🌐', s / 2, s / 2);
}

[16, 48, 128].forEach(size => {
  const canvas = document.getElementById(`c${size}`);
  drawIcon(canvas);
  const link = document.createElement('a');
  link.download = `icon${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.textContent = `下載 icon${size}.png`;
  link.style.display = 'block';
  link.style.margin = '8px';
  document.body.appendChild(link);
});
</script>
</body>
</html>
