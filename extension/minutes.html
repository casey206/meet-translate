<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會議記錄 · MeetTranslate</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { min-height: 100vh; }
    .app { display: grid; grid-template-columns: 330px 1fr; min-height: 100vh; }

    /* 側欄 */
    .side { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 100vh; }
    .side-top { padding: 26px 24px 18px; border-bottom: 1px solid var(--line); }
    .mk { font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
    .mk b { color: var(--accent); }
    .side-title { margin-top: 18px; font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; }
    .side-sub { margin-top: 5px; font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.14em; text-transform: uppercase; }

    .list { flex: 1; overflow-y: auto; padding: 12px; }
    .s-card {
      padding: 14px 15px; border: 1px solid var(--line); border-radius: var(--r-md);
      margin-bottom: 9px; cursor: pointer; background: var(--surface);
      transition: border-color .15s, box-shadow .15s, transform .1s; position: relative;
    }
    .s-card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
    .s-card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .s-card .s-date { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: 0.02em; }
    .s-card .s-name { margin-top: 5px; font-size: 14px; color: var(--ink); font-weight: 600; line-height: 1.35; }
    .s-card .s-meta { margin-top: 10px; display: flex; gap: 6px; }
    .empty-list { padding: 44px 20px; text-align: center; color: var(--faint); font-size: 12.5px; line-height: 1.8; }

    /* 主區 */
    .main { overflow-y: auto; height: 100vh; }
    .main-inner { max-width: 840px; margin: 0 auto; padding: 52px 56px 90px; }

    .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; color: var(--faint); }
    .placeholder .big { font-size: 46px; margin-bottom: 18px; opacity: .8; }
    .placeholder h2 { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--ink-soft); letter-spacing: -0.01em; }
    .placeholder p { margin-top: 10px; font-size: 13.5px; max-width: 340px; line-height: 1.75; color: var(--muted); }

    .doc-head { border-bottom: 1px solid var(--line); padding-bottom: 24px; margin-bottom: 28px; }
    .doc-eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .doc-title {
      display: block; width: 100%; margin-top: 12px; margin-left: -6px;
      font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1.12;
      letter-spacing: -0.025em; color: var(--ink);
      background: transparent; border: none; outline: none; border-radius: 8px; padding: 2px 6px;
    }
    .doc-title::placeholder { color: var(--faint); }
    .doc-title:hover { background: var(--surface-2); }
    .doc-title:focus { background: var(--surface-2); box-shadow: 0 0 0 2px var(--accent-soft); }
    .doc-meta { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .doc-meta .mi { font-family: var(--mono); font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
    .toolbar .grow { flex: 1; }

    .report {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-lg); padding: 34px 38px; margin-bottom: 40px; box-shadow: var(--shadow);
    }
    .report.empty { text-align: center; padding: 50px 32px; }
    .report.empty .e-ic { font-size: 30px; }
    .report.empty p { margin: 14px 0 20px; color: var(--muted); font-size: 13.5px; line-height: 1.75; }

    .rep-langs { display: flex; gap: 8px; margin-bottom: 20px; }
    .rl { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--muted); cursor: pointer; transition: all .15s; }
    .rl:hover { color: var(--ink); }
    .rl.on { background: var(--accent); border-color: transparent; color: #fff; }
    .report h2 { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink); margin: 28px 0 13px; padding-bottom: 9px; border-bottom: 2px solid var(--accent); display: inline-block; letter-spacing: -0.01em; }
    .report h2:first-child { margin-top: 0; }
    .report h3 { font-size: 13.5px; color: var(--me); margin: 18px 0 7px; font-weight: 700; }
    .report p { font-size: 14.5px; line-height: 1.85; color: var(--ink-soft); margin: 9px 0; }
    .report ul { margin: 10px 0; list-style: none; }
    .report li { position: relative; padding-left: 22px; font-size: 14.5px; line-height: 1.8; color: var(--ink-soft); margin: 6px 0; }
    .report li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .report strong { color: var(--ink); font-weight: 700; }
    .skeleton-line { height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin: 12px 0; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .transcript-head { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
    .transcript-head .line { flex: 1; height: 1px; background: var(--line); }

    .turn { display: grid; grid-template-columns: 62px 1fr; gap: 16px; padding: 10px 0; }
    .turn .time { font-family: var(--mono); font-size: 10.5px; color: var(--faint); padding-top: 4px; text-align: right; }
    .turn .bubble { border-left: 2px solid var(--line-2); padding: 1px 0 1px 16px; }
    .turn.them .bubble { border-left-color: var(--them); }
    .turn.me .bubble { border-left-color: var(--me); }
    .turn .who { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; }
    .turn.them .who { color: var(--them); }
    .turn.me .who { color: var(--me); }
    .turn .main-text { font-size: 15px; line-height: 1.6; color: var(--ink); }
    .turn .sub-text { font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 4px; }

    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: #fff; font-size: 13px; font-weight: 600;
      padding: 11px 20px; border-radius: 999px; box-shadow: var(--shadow-lg);
      opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="aura">
  <div class="app">
    <aside class="side">
      <div class="side-top">
        <div class="mk">MEET<b>·</b>TRANSLATE</div>
        <div class="side-title">會議記錄</div>
        <div class="side-sub" id="sessionCount">— Archive</div>
      </div>
      <div class="list" id="list"></div>
    </aside>

    <main class="main" id="main">
      <div class="placeholder" id="placeholder">
        <div class="big">🗂️</div>
        <h2>選擇一場會議</h2>
        <p>左側是你過往的會議逐字稿。選一場即可檢視內容，並一鍵產生 AI 會議記錄。</p>
      </div>
      <div class="main-inner" id="detail" style="display:none;"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="langs.js"></script>
  <script src="gemini.js"></script>
  <script src="minutes.js"></script>
</body>
</html>
